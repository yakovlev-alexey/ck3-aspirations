l_english:
 asp_holding_recovery_story:0 "Restore a wounded holding"
 asp_holding_recovery_story_desc:0 "A county I cannot bear to leave wounded."
 asp_recovery_origin_title:0 "What the Enemy Left Behind"
 asp_recovery_origin_desc:0 "The enemy has left [asp_recovery_event_county.GetName] shaken. This is my land, and its troubles will not mend merely because the enemy has gone. I could turn my attention to restoring it.\n\nIs it the people who move me, the standing of my house, or the thought of a county able to sustain itself again?"
 asp_recovery_protection:0 "My people deserve better than this."
 asp_recovery_family_prestige:0 "My house will not be remembered for neglect."
 asp_recovery_income:0 "This land must prosper again."
 asp_recovery_release:0 "Let this ambition go."
 asp_recovery_condition:0 "Keep a recovery ambition. While personally holding the county, restore Control to at least 80 AND finish supported construction begun after the ambition and funded by you. Supported work: Tribal Markets or Palisades I–II, or new Pastures, Cereal Fields or Hill Farms I where legal. Existing, cancelled, foreign-funded or ownership-interrupted work does not count. Cancellation requires a fresh start. Costs are paid normally; available work may require saving funds. On fulfillment: +100 Stewardship experience, base 20 Stress relief (Stress Loss modifiers apply), and a non-stacking county +5% tax modifier for three years. First review: eight years."
 asp_recovery_release_cost:0 "Early release has a base cost of 10 Stress; native Stress Gain modifiers apply. At the scheduled review age, private release is free. A declared aspiration uses its stated withdrawal penalty once."
 asp_recovery_terminal_title:0 "A Holding's Recovery"
 asp_recovery_fulfilled_desc:0 "[asp_recovery_event_county.GetName] is steadier now, and the work I paid for is complete. Where I once saw a county in need of care, I can see the beginnings of a future again.\n\nThere will always be more to ask of a ruler. For now, I have kept faith with this land."
 asp_recovery_lost_desc:0 "[asp_recovery_event_county.GetName] is no longer mine to govern. I had imagined what I might make of it, but that future has slipped beyond my reach.\n\nThe care I meant to give it will remain unfinished. Other hands must decide what comes next."
 asp_recovery_abandoned_desc:0 "I have laid down my purpose for [asp_recovery_event_county.GetName]. The wish to restore it no longer governs my course.\n\nI remember why its troubles first moved me. That memory will remain, even as I turn toward other duties."
 asp_recovery_story_information:0 "[Story.Custom('asp_recovery_story_information')]"
 asp_recovery_story_information_private:0 "[Story.MakeScope.Var('asp_target').Title.GetName] deserves the care I have chosen to give it: I mean to [Story.Custom('asp_recovery_story_interpretation')].\nCause: [Story.Custom('asp_recovery_story_cause')]. Control at origin: [Story.MakeScope.Var('asp_recovery_origin_control').GetValue|0].\n\nObjective: personally hold the county, restore Control to at least 80 AND finish supported construction begun after this ambition and funded by me.\nSupported work: Tribal Markets or Palisades I–II; new Pastures, Cereal Fields or Hill Farms I where legal. Existing, cancelled, foreign-funded or ownership-interrupted work does not count; cancellation requires a fresh start.\nFulfillment: base 20 Stress relief (Stress Loss modifiers apply), +100 Stewardship experience, non-stacking +5% county tax for three years.\nStatus: Private ambition.\nAge: [Story.MakeScope.ScriptValue('asp_story_age_days')|0] days. Review: [Story.MakeScope.ScriptValue('asp_time_until_review_days')|0] days remaining. Release is free after the original eight-year review age."
 asp_recovery_story_information_declared:0 "I have promised to [Story.Custom('asp_recovery_story_interpretation')] in [Story.MakeScope.Var('asp_target').Title.GetName].\nCause: [Story.Custom('asp_recovery_story_cause')]. Control at origin: [Story.MakeScope.Var('asp_recovery_origin_control').GetValue|0].\n\nObjective: personally hold the county, restore Control to at least 80 AND finish supported construction begun after this ambition and funded by me.\nSupported work: Tribal Markets or Palisades I–II; new Pastures, Cereal Fields or Hill Farms I where legal. Existing, cancelled, foreign-funded or ownership-interrupted work does not count; cancellation requires a fresh start.\nFulfillment: base 20 Stress relief (Stress Loss modifiers apply), +100 Stewardship experience, non-stacking +5% county tax for three years.\nStatus: Public pledge.\nAge: [Story.MakeScope.ScriptValue('asp_story_age_days')|0] days. Review: [Story.MakeScope.ScriptValue('asp_time_until_review_days')|0] days remaining.\nDeadline: [Story.MakeScope.ScriptValue('asp_time_until_pledge_days')|0] days remaining. Expiry takes precedence at equality. Public success: additional +100 Prestige. Withdrawal or expiry: −100 Prestige, base +15 Stress. Stress Gain modifiers apply."
 asp_recovery_story_cause_raid:0 "An enemy raid"
 asp_recovery_story_cause_siege:0 "An enemy siege"
 asp_recovery_story_interpretation_protection:0 "protect the inhabitants"
 asp_recovery_story_interpretation_family_prestige:0 "restore my family's standing"
 asp_recovery_story_interpretation_income:0 "restore the local economy"
 asp_holding_recovery_tax_modifier:0 "Renewed Local Prosperity"
 asp_holding_recovery_tax_modifier_desc:0 "The fruits of renewed care are beginning to show in the county's prosperity."
 asp_recovery_fulfilled_memory_desc:0 "I gave my care to a damaged county and saw its recovery through."
 asp_recovery_fulfilled_memory_second:0 "You gave your care to a damaged county and saw its recovery through."
 asp_recovery_fulfilled_memory_third:0 "[owner.GetShortUIName] gave a damaged county the care it needed to recover."
 asp_recovery_lost_memory_desc:0 "A county passed beyond my rule before I could finish restoring it."
 asp_recovery_lost_memory_second:0 "A county passed beyond your rule before you could finish restoring it."
 asp_recovery_lost_memory_third:0 "[owner.GetShortUIName] lost a county before its recovery was complete."
 asp_recovery_abandoned_memory_desc:0 "I laid down my purpose of restoring a damaged county and turned to other matters."
 asp_recovery_abandoned_memory_second:0 "You laid down your purpose of restoring a damaged county and turned to other matters."
 asp_recovery_abandoned_memory_third:0 "[owner.GetShortUIName] set aside the purpose of restoring a damaged county."

 asp_recovery_replace_offer_desc:0 "The troubles of [asp_replacement_cause_county.GetName] call for my attention. I already carry purposes that claim my time and care. If I am to give myself to this county's recovery, which of those earlier intentions am I willing to lay down?"
 asp_recovery_replace_desc:0 "[asp_replacement_cause_county.GetName] needs care, and I feel drawn to give it. Yet my earlier purpose still has a claim upon me. I must decide whether to set that purpose aside and turn toward this wounded county."
 asp_recovery_review_desc:0 "I still think of [asp_selected_story.MakeScope.Var('asp_target').Title.GetName] and what drew me to its recovery. Was it care for its people, pride in my house, or the hope of prosperity? I should consider which of those wishes still moves me."
 asp_recovery_declare_desc:0 "I mean to restore [asp_selected_story.MakeScope.Var('asp_target').Title.GetName]. To say so before my court would place my word alongside my intention: others would know what I meant to do, and remember whether I did it.\n\nAm I ready to ask them to judge me by this promise?"
 asp_recovery_replace_1:0 "Consider replacing the recovery ambition for [asp_replacement_1.MakeScope.Var('asp_target').Title.GetName]"
 asp_recovery_replace_2:0 "Consider replacing the recovery ambition for [asp_replacement_2.MakeScope.Var('asp_target').Title.GetName]"
 asp_recovery_replace_3:0 "Consider replacing the recovery ambition for [asp_replacement_3.MakeScope.Var('asp_target').Title.GetName]"

 asp_recovery_fulfilled_memory:0 "A Holding Restored"
 asp_recovery_lost_memory:0 "An Interrupted Recovery"
 asp_recovery_abandoned_memory:0 "A Recovery Relinquished"
 asp_recovery_declared_county_desc:0 "I spoke before my court of restoring [asp_selected_story.MakeScope.Var('asp_target').Title.GetName]. Now the promise follows me whenever I think of the county. I must decide whether my resolve still matches the words I gave."

 asp_recovery_pledge_withdrawn_desc:0 "I promised to restore [asp_pledge_event_target.GetName], but I can no longer stand by that word. The county's future will not be the one I asked my court to expect. I must accept what that admission says about my resolve."
 asp_recovery_pledge_expired_desc:0 "The term I set for the recovery of [asp_pledge_event_target.GetName] has passed. I have not delivered what I promised. The land may still need my care, but renewed effort cannot make my earlier word a kept one."
 asp_recovery_pledge_excused_desc:0 "[asp_pledge_event_target.GetName] has passed beyond my rule. I cannot carry out the work I promised there. The intention remains in my memory, even as the promise loses its purpose."
 asp_recovery_pledge_fulfilled_desc:0 "I promised to restore [asp_pledge_event_target.GetName], and I have done so within the term I gave. My court can see that my words were followed by work. For once, the demands of a ruler and a wish of my own have met at the same end."

 asp_recovery_private_county_desc:0 "[asp_selected_story.MakeScope.Var('asp_target').Title.GetName] still calls to mind the care I meant to give it. The wish remains my own, unspoken before the realm. Do I still want the same future for this county, and am I willing to pursue it?"
 asp_recovery_protection_flavor:0 "I make the inhabitants' security the purpose of my work here."
 asp_recovery_family_prestige_flavor:0 "I resolve to make my care for this land worthy of my family's name."
 asp_recovery_income_flavor:0 "I turn toward the work that will let this county sustain my realm again."
 asp_recovery_fulfilled_happened:0 "The recovery ambition has been fulfilled and a memory recorded. Gained 100 Stewardship experience and applied fulfillment Stress relief (base 20; Stress Loss modifiers apply). The county received a non-stacking +5% tax modifier for three years; construction costs were not reimbursed."
 asp_recovery_lost_happened:0 "The ambition has ended with a memory, without a fulfillment reward or private penalty for involuntary or unclassified loss. Any public pledge follows its separate settlement."
 asp_recovery_released_happened:0 "The ambition has ended with a memory, without a fulfillment reward. Abandonment or a voluntary grant uses the applicable release cost; any public pledge follows its separate settlement."
