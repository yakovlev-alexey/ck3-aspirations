l_english:
 asp_holding_recovery_story:0 "Restore a wounded holding"
 asp_holding_recovery_story_desc:0 "An ambition to restore a damaged county through control and new construction."
 asp_recovery_origin_title:0 "Restore a Wounded Holding"
 asp_recovery_origin_desc:0 "The enemy has left [asp_recovery_event_county.GetName] shaken. Its recorded Control was [asp_recovery_event_story.MakeScope.Var('asp_recovery_origin_control').GetValue|0]. I could make its recovery a lasting ambition. Supported work is Markets or Palisades I–II in a tribal holding, or new Pastures, Cereal Fields or Hill Farms I in a suitable castle, city or temple. A legal opportunity exists; I may still need to save the resources."
 asp_recovery_protection:0 "Protect the inhabitants."
 asp_recovery_family_prestige:0 "Restore my family's standing here."
 asp_recovery_income:0 "Restore the local economy."
 asp_recovery_release:0 "Let this ambition go."
 asp_recovery_condition:0 "While personally holding the county, restore Control to at least 80 and finish supported construction begun after this ambition, paid for by you. Both conditions are required. Pre-existing, cancelled, foreign-funded or unproven work does not count. Success grants 100 Stewardship experience, relieves 20 Stress, and gives the county +5% tax for three years. Native Stress modifiers apply. Construction costs are paid normally."
 asp_recovery_release_cost:0 "Early release has a base cost of 10 Stress; native Stress Gain modifiers apply. At the scheduled review age, private release is free. A declared aspiration uses its stated withdrawal penalty once."
 asp_recovery_terminal_title:0 "A Holding's Recovery"
 asp_recovery_fulfilled_desc:0 "[asp_recovery_event_county.GetName] has recovered its Control, and the work I paid for is complete. My ambition leaves a lasting memory and a short period of renewed local prosperity."
 asp_recovery_lost_desc:0 "I no longer personally hold [asp_recovery_event_county.GetName]. This ambition ends with a memory. An involuntary or unclassified loss brings no additional private penalty."
 asp_recovery_abandoned_desc:0 "I have relinquished my ambition for [asp_recovery_event_county.GetName]. A voluntary grant follows the same release costs as abandonment; an active public pledge takes precedence."
 asp_recovery_story_information:0 "[Story.Custom('asp_recovery_story_information')]"
 asp_recovery_story_information_private:0 "Private ambition for [Story.MakeScope.Var('asp_target').Title.GetName]. [Story.Custom('asp_recovery_story_cause')] left its recorded Control at [Story.MakeScope.Var('asp_recovery_origin_control').GetValue|0]. I chose to [Story.Custom('asp_recovery_story_interpretation')].\n\nWhile personally holding this county, restore Control 80 and finish supported owner-funded construction begun after this ambition. Both milestones are required; pre-existing, cancelled or foreign-funded work does not count. Supported work: Tribal Markets or Palisades I–II, or new Pastures, Cereal Fields or Hill Farms I where legal. Age: [Story.MakeScope.ScriptValue('asp_story_age_days')|0] days. Next review in [Story.MakeScope.ScriptValue('asp_time_until_review_days')|0] days. Private release is free after the original eight-year review age."
 asp_recovery_story_information_declared:0 "Declared ambition for [Story.MakeScope.Var('asp_target').Title.GetName]. [Story.Custom('asp_recovery_story_cause')] left its recorded Control at [Story.MakeScope.Var('asp_recovery_origin_control').GetValue|0]. I chose to [Story.Custom('asp_recovery_story_interpretation')].\n\nWhile personally holding this county, restore Control 80 and finish supported owner-funded construction begun after this ambition. Both milestones are required; pre-existing, cancelled or foreign-funded work does not count. Supported work: Tribal Markets or Palisades I–II, or new Pastures, Cereal Fields or Hill Farms I where legal. Age: [Story.MakeScope.ScriptValue('asp_story_age_days')|0] days. Next review in [Story.MakeScope.ScriptValue('asp_time_until_review_days')|0] days. Public deadline in [Story.MakeScope.ScriptValue('asp_time_until_pledge_days')|0] days. Public success adds 100 Prestige; withdrawal or expiry costs 100 Prestige and base 15 Stress once."
 asp_recovery_story_cause_raid:0 "An enemy raid"
 asp_recovery_story_cause_siege:0 "An enemy siege"
 asp_recovery_story_interpretation_protection:0 "protect the inhabitants"
 asp_recovery_story_interpretation_family_prestige:0 "restore my family's standing"
 asp_recovery_story_interpretation_income:0 "restore the local economy"
 asp_holding_recovery_tax_modifier:0 "Renewed Local Prosperity"
 asp_holding_recovery_tax_modifier_desc:0 "Completed recovery work supports county taxes for three years."
 asp_recovery_fulfilled_memory_desc:0 "I fulfilled an ambition to restore a damaged holding."
 asp_recovery_fulfilled_memory_second:0 "You fulfilled an ambition to restore a damaged holding."
 asp_recovery_fulfilled_memory_third:0 "[owner.GetShortUIName] fulfilled an ambition to restore a damaged holding."
 asp_recovery_lost_memory_desc:0 "I lost a holding before its recovery ambition could be completed."
 asp_recovery_lost_memory_second:0 "You lost a holding before its recovery ambition could be completed."
 asp_recovery_lost_memory_third:0 "[owner.GetShortUIName] lost a holding before its recovery ambition could be completed."
 asp_recovery_abandoned_memory_desc:0 "I relinquished an ambition to restore a damaged holding."
 asp_recovery_abandoned_memory_second:0 "You relinquished an ambition to restore a damaged holding."
 asp_recovery_abandoned_memory_third:0 "[owner.GetShortUIName] relinquished an ambition to restore a damaged holding."

 asp_recovery_replace_offer_desc:0 "Damage to [asp_replacement_cause_county.GetName] calls for recovery. I already have three ambitions. I can select one to replace, with its release or pledge cost shown before confirmation, or retain all three. This incident cannot offer another proposal."
 asp_recovery_replace_desc:0 "Replace the selected ambition with recovery of [asp_replacement_cause_county.GetName]? The old ambition ends only if this new circumstance remains eligible."
 asp_recovery_review_desc:0 "My recovery ambition for [asp_selected_story.MakeScope.Var('asp_target').Title.GetName] keeps its recorded cause and age. I may retain a due reminder, release it, or choose another interpretation. Public commitment costs still apply."
 asp_recovery_declare_desc:0 "Before my court, I intend to restore [asp_selected_story.MakeScope.Var('asp_target').Title.GetName] to Control 80 and complete new supported construction paid for by me while personally holding the county. The deadline is five years. Success adds 100 Prestige; expiry or withdrawal costs 100 Prestige and base 15 Stress once. Native Stress modifiers apply."
 asp_recovery_replace_1:0 "Consider replacing the recovery ambition for [asp_replacement_1.MakeScope.Var('asp_target').Title.GetName]"
 asp_recovery_replace_2:0 "Consider replacing the recovery ambition for [asp_replacement_2.MakeScope.Var('asp_target').Title.GetName]"
 asp_recovery_replace_3:0 "Consider replacing the recovery ambition for [asp_replacement_3.MakeScope.Var('asp_target').Title.GetName]"

 asp_recovery_fulfilled_memory:0 "A Holding Restored"
 asp_recovery_lost_memory:0 "An Interrupted Recovery"
 asp_recovery_abandoned_memory:0 "A Recovery Relinquished"
 asp_recovery_declared_county_desc:0 "My declared recovery concerns [asp_selected_story.MakeScope.Var('asp_target').Title.GetName]. Restore Control 80 and finish new owner-funded supported construction. Public deadline: [asp_selected_story.MakeScope.ScriptValue('asp_time_until_pledge_days')|0] days remain. Withdrawal uses the stated pledge penalty once."

 asp_recovery_pledge_withdrawn_desc:0 "My public recovery commitment for [asp_pledge_event_target.GetName] has been withdrawn. I lose 100 Prestige and gain base 15 Stress, adjusted by native Stress Gain modifiers, once."
 asp_recovery_pledge_expired_desc:0 "The deadline for my public recovery commitment for [asp_pledge_event_target.GetName] has arrived. I lose 100 Prestige and gain base 15 Stress, adjusted by native Stress Gain modifiers, once. The remaining private ambition may continue."
 asp_recovery_pledge_excused_desc:0 "Recovery of [asp_pledge_event_target.GetName] became impossible through an involuntary or unclassified title loss. The public commitment ends without a reward or penalty."
 asp_recovery_pledge_fulfilled_desc:0 "I restored [asp_pledge_event_target.GetName] before the recorded public deadline. The realm recognizes my kept word: 100 additional Prestige."

 asp_recovery_private_county_desc:0 "My private recovery ambition concerns [asp_selected_story.MakeScope.Var('asp_target').Title.GetName]. While personally holding it, restore Control to at least 80 and finish new supported construction paid for by me. Both milestones are needed. Pre-existing, cancelled, foreign-funded or unproven work cannot satisfy it. I may pursue this ambition, reconsider its meaning, or release it at the shown cost."
