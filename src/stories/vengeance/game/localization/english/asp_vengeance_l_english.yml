l_english:
 asp_vengeance_story:0 "Vengeance for a loved one"
 asp_vengeance_story_desc:0 "A loss that still asks something of me."
 asp_vengeance_victim_label:0 "Loved one"
 asp_vengeance_culprit_label:0 "Known culprit"
 asp_vengeance_story_information:0 "[Story.Custom('asp_vengeance_story_information')]"
 asp_vengeance_origin_title:0 "A loss I cannot forget"
 asp_vengeance_origin_desc:0 "[asp_vengeance_event_victim.GetShortUIName] is dead, and I know that [asp_vengeance_event_culprit.GetShortUIName] was responsible. The name returns to me whenever I think of the one I have lost.\n\nGrief alone cannot tell me what to do. I could seek a life in payment, bring the culprit into my custody, or try to loosen the hold this loss has upon me."
 asp_vengeance_personal:0 "Their life will answer for this."
 asp_vengeance_personal_condition:0 "Keep an ambition fulfilled only by the culprit's death for which you are responsible. On fulfillment: apply base 20 Stress relief (Stress Loss modifiers apply), with no accountability Prestige. Use existing actions; ordinary legal, personality and secrecy consequences remain."
 asp_vengeance_accountability:0 "I will make them answer to me."
 asp_vengeance_accountability_condition:0 "Keep an ambition fulfilled by acquiring the culprit's custody after the aspiration began. On fulfillment: gain 100 Prestige and apply base 20 Stress relief (Stress Loss modifiers apply). This choice neither imprisons the culprit nor grants a lawful imprisonment reason. Existing custody does not count."
 asp_vengeance_forgive:0 "I will try to forgive."
 asp_vengeance_release_cost:0 "Early forgiveness uses base [asp_vengeance_event_story.MakeScope.ScriptValue('asp_abandonment_stress')|0] Stress. Your Stress Gain modifiers apply. This records forgiveness, without a fulfillment reward."
 asp_vengeance_terminal_title:0 "The shape of closure"
 asp_vengeance_forgiven_desc:0 "I have chosen to forgive [asp_vengeance_memory_culprit.GetShortUIName] for the death of [asp_vengeance_memory_victim.GetShortUIName]. The loss remains, but I will try to remember more than the anger it left behind. I cannot know how easily that resolve will hold."
 asp_vengeance_impossible_desc:0 "[asp_vengeance_memory_culprit.GetShortUIName] is dead. The pursuit that held my grief has ended without the answer I sought.\n\n[asp_vengeance_memory_victim.GetShortUIName] is still gone. I must learn what to do with that loss when there is no longer anyone to pursue."
 asp_vengeance_abandoned_desc:0 "I have set aside my pursuit of [asp_vengeance_memory_culprit.GetShortUIName]. Perhaps other duties have greater claim upon me; perhaps I have given this anger enough of my life.\n\nI will still remember [asp_vengeance_memory_victim.GetShortUIName]. Letting the pursuit go cannot take that memory from me."
 asp_vengeance_accountability_desc:0 "[asp_vengeance_memory_culprit.GetShortUIName] is in my custody. The person responsible for the death of [asp_vengeance_memory_victim.GetShortUIName] is finally within my power.\n\nI have reached the end I sought. What I do with that power, and what comfort it can offer, are questions I must now face."
 asp_vengeance_personal_desc:0 "[asp_vengeance_memory_culprit.GetShortUIName] is dead, and I was responsible. For so long, my thoughts of [asp_vengeance_memory_victim.GetShortUIName] led back to this purpose. Now there is no pursuit left to follow.\n\nI have done what I intended. I must live with the deed as well as the loss."
 asp_vengeance_terminal_close:0 "I will remember."
 asp_vengeance_personal_memory:0 "avenged a loved one's death"
 asp_vengeance_personal_memory_desc:0 "I caused the death of [culprit.GetShortUIName] in vengeance for [victim.GetShortUIName]."
 asp_vengeance_personal_memory_desc_second_perspective:0 "You caused the death of [culprit.GetShortUIName] in vengeance for [victim.GetShortUIName]."
 asp_vengeance_personal_memory_desc_third_perspective:0 "[owner.GetShortUIName] brought a pursuit concerning [culprit.GetShortUIName] and the loss of [victim.GetShortUIName] to an end."
 asp_vengeance_accountability_memory:0 "brought the culprit into my custody"
 asp_vengeance_accountability_memory_desc:0 "I brought [culprit.GetShortUIName] into my custody to answer for the death of [victim.GetShortUIName]."
 asp_vengeance_accountability_memory_desc_second_perspective:0 "You brought [culprit.GetShortUIName] into your custody to answer for the death of [victim.GetShortUIName]."
 asp_vengeance_accountability_memory_desc_third_perspective:0 "[owner.GetShortUIName] brought [culprit.GetShortUIName] into custody to answer for the death of [victim.GetShortUIName]."
 asp_vengeance_forgiven_memory:0 "chose to forgive a loved one's killer"
 asp_vengeance_forgiven_memory_desc:0 "I chose to forgive [culprit.GetShortUIName] for the death of [victim.GetShortUIName], and tried to remember more than my anger."
 asp_vengeance_forgiven_memory_desc_second_perspective:0 "You chose to forgive [culprit.GetShortUIName] for the death of [victim.GetShortUIName], and tried to remember more than your anger."
 asp_vengeance_forgiven_memory_desc_third_perspective:0 "[owner.GetShortUIName] chose to forgive [culprit.GetShortUIName] for the death of [victim.GetShortUIName]."
 asp_vengeance_impossible_memory:0 "lost the chance to answer a loved one's death"
 asp_vengeance_impossible_memory_desc:0 "[culprit.GetShortUIName] died before I could bring my pursuit for [victim.GetShortUIName] to an end."
 asp_vengeance_impossible_memory_desc_second_perspective:0 "[culprit.GetShortUIName] died before you could bring your pursuit for [victim.GetShortUIName] to an end."
 asp_vengeance_impossible_memory_desc_third_perspective:0 "[culprit.GetShortUIName] died before [owner.GetShortUIName] could bring the pursuit for [victim.GetShortUIName] to an end."
 asp_vengeance_abandoned_memory:0 "set aside my pursuit of a loved one's killer"
 asp_vengeance_abandoned_memory_desc:0 "I stopped pursuing [culprit.GetShortUIName] for the death of [victim.GetShortUIName], though I still remembered the loss."
 asp_vengeance_abandoned_memory_desc_second_perspective:0 "You stopped pursuing [culprit.GetShortUIName] for the death of [victim.GetShortUIName], though you still remembered the loss."
 asp_vengeance_abandoned_memory_desc_third_perspective:0 "[owner.GetShortUIName] stopped pursuing [culprit.GetShortUIName] for the death of [victim.GetShortUIName]."
 asp_vengeance_condition_personal:0 "Objective: cause the culprit's death through your own action. Fulfillment: base 20 Stress relief (Stress Loss modifiers apply); ordinary action consequences remain."
 asp_vengeance_condition_accountability:0 "Objective: acquire the culprit's custody after this ambition began. Fulfillment: +100 Prestige, base 20 Stress relief (Stress Loss modifiers apply); ordinary legal consequences remain."
 asp_vengeance_story_information_private:0 "I remember [Story.MakeScope.Var('asp_vengeance_victim').Char.GetShortUIName], and the part [Story.MakeScope.Var('asp_target').Char.GetShortUIName] played in that loss.\n\n[SelectLocalization(ObjectsEqual(Story.MakeScope.Var('asp_interpretation').GetFlagName,'accountability'),'asp_vengeance_condition_accountability','asp_vengeance_condition_personal')]\nStatus: Private ambition.\nAge: [Story.MakeScope.ScriptValue('asp_story_age_days')|0] days. Review: [Story.MakeScope.ScriptValue('asp_time_until_review_days')|0] days remaining. Release is free after the original eight-year review age, even after retention."
 asp_vengeance_story_information_declared:0 "I have given my word concerning [Story.MakeScope.Var('asp_target').Char.GetShortUIName], for the loss of [Story.MakeScope.Var('asp_vengeance_victim').Char.GetShortUIName].\n\n[SelectLocalization(ObjectsEqual(Story.MakeScope.Var('asp_interpretation').GetFlagName,'accountability'),'asp_vengeance_condition_accountability','asp_vengeance_condition_personal')]\nStatus: Public pledge.\nAge: [Story.MakeScope.ScriptValue('asp_story_age_days')|0] days. Review: [Story.MakeScope.ScriptValue('asp_time_until_review_days')|0] days remaining.\nDeadline: [Story.MakeScope.ScriptValue('asp_time_until_pledge_days')|0] days remaining. Expiry takes precedence at equality. Public success: additional +100 Prestige. Withdrawal or expiry: −100 Prestige, base +15 Stress. Secret vengeance withdraws the pledge. Stress Gain modifiers apply."
 asp_vengeance_personal_flavor:0 "I turn my grief toward ending the life of the one responsible."
 asp_vengeance_accountability_flavor:0 "I resolve to bring the culprit into my custody, where I can decide how to answer this loss."
 asp_vengeance_forgive_flavor:0 "I try to remember the one I lost without making the culprit the centre of my life."
 asp_vengeance_fulfilled_happened:0 "The private ambition has been fulfilled and a memory recorded. Applied fulfillment Stress relief (base 20; Stress Loss modifiers apply). Ordinary action consequences remain."
 asp_vengeance_accountability_happened:0 "The private accountability ambition has been fulfilled and a memory recorded. Gained 100 Prestige and applied fulfillment Stress relief (base 20; Stress Loss modifiers apply). Ordinary legal consequences remain."
 asp_vengeance_impossible_happened:0 "The ambition has ended with a memory of unresolved loss, without a fulfillment reward or private release cost. Any public pledge follows its separate settlement."
 asp_vengeance_release_happened:0 "The pursuit has ended and a memory recorded, without a fulfillment reward. The release cost shown when you chose this ending has been settled; any public pledge follows its separate settlement."
