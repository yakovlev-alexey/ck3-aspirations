l_english:
 asp_vengeance_story:0 "Vengeance for a loved one"
 asp_vengeance_story_desc:0 "An ambition born of a known killing."
 asp_vengeance_victim_label:0 "Loved one"
 asp_vengeance_culprit_label:0 "Known culprit"
 asp_vengeance_story_information:0 "[Story.Custom('asp_vengeance_story_information')]"
 asp_vengeance_origin_title:0 "A loss I cannot forget"
 asp_vengeance_origin_desc:0 "[asp_vengeance_event_victim.GetShortUIName] is dead. I know that [asp_vengeance_event_culprit.GetShortUIName] was responsible. This bereavement has become an ambition.\n\nWhat would bring me closure?"
 asp_vengeance_personal:0 "I will bring their life to an end."
 asp_vengeance_personal_condition:0 "Fulfill this ambition only by being recorded as responsible for the culprit’s death. Closure removes 20 Stress. Use existing game actions; their usual legal, personality, and secrecy consequences remain. Secret vengeance grants no accountability prestige."
 asp_vengeance_accountability:0 "I will bring them into my custody."
 asp_vengeance_accountability_condition:0 "Acquire custody after choosing this interpretation to gain 100 Prestige and remove 20 Stress. This grants no imprisonment reason or new action. Existing custody cannot fulfill it."
 asp_vengeance_forgive:0 "I will try to forgive."
 asp_vengeance_release_cost:0 "Early forgiveness uses base [asp_vengeance_event_story.MakeScope.ScriptValue('asp_abandonment_stress')|0] Stress. Your Stress Gain modifiers apply. This records forgiveness, without a fulfillment reward."
 asp_vengeance_terminal_title:0 "The shape of closure"
 asp_vengeance_forgiven_desc:0 "I have chosen to forgive [asp_vengeance_memory_culprit.GetShortUIName] for the death of [asp_vengeance_memory_victim.GetShortUIName]. This is a release of my pursuit, not its fulfillment."
 asp_vengeance_impossible_desc:0 "[asp_vengeance_memory_culprit.GetShortUIName] has died without fulfilling my pursuit. The loss of [asp_vengeance_memory_victim.GetShortUIName] remains unresolved; there is no reward for this ending."
 asp_vengeance_abandoned_desc:0 "I have released my pursuit of [asp_vengeance_memory_culprit.GetShortUIName]. I still remember [asp_vengeance_memory_victim.GetShortUIName]."
 asp_vengeance_accountability_desc:0 "[asp_vengeance_memory_culprit.GetShortUIName] is now in my custody. I have brought my ambition concerning [asp_vengeance_memory_victim.GetShortUIName] to its promised conclusion."
 asp_vengeance_personal_desc:0 "I was responsible for the death of [asp_vengeance_memory_culprit.GetShortUIName]. My pursuit concerning [asp_vengeance_memory_victim.GetShortUIName] has ended. My conscience and the consequences of my act remain my own."
 asp_vengeance_terminal_close:0 "I will remember."
 asp_vengeance_personal_memory:0 "brought my personal pursuit of vengeance to an end"
 asp_vengeance_personal_memory_desc:0 "I brought my personal pursuit of vengeance to an end concerning [victim.GetShortUIName] and [culprit.GetShortUIName]."
 asp_vengeance_personal_memory_desc_second_perspective:0 "You brought your personal pursuit of vengeance to an end concerning [victim.GetShortUIName] and [culprit.GetShortUIName]."
 asp_vengeance_personal_memory_desc_third_perspective:0 "[owner.GetShortUIName] brought a personal pursuit of vengeance to an end concerning [victim.GetShortUIName] and [culprit.GetShortUIName]."
 asp_vengeance_accountability_memory:0 "brought the culprit into my custody"
 asp_vengeance_accountability_memory_desc:0 "I brought the culprit into my custody concerning [victim.GetShortUIName] and [culprit.GetShortUIName]."
 asp_vengeance_accountability_memory_desc_second_perspective:0 "You brought the culprit into your custody concerning [victim.GetShortUIName] and [culprit.GetShortUIName]."
 asp_vengeance_accountability_memory_desc_third_perspective:0 "[owner.GetShortUIName] brought the culprit into custody concerning [victim.GetShortUIName] and [culprit.GetShortUIName]."
 asp_vengeance_forgiven_memory:0 "chose forgiveness after my bereavement"
 asp_vengeance_forgiven_memory_desc:0 "I chose forgiveness after my bereavement concerning [victim.GetShortUIName] and [culprit.GetShortUIName]."
 asp_vengeance_forgiven_memory_desc_second_perspective:0 "You chose forgiveness after your bereavement concerning [victim.GetShortUIName] and [culprit.GetShortUIName]."
 asp_vengeance_forgiven_memory_desc_third_perspective:0 "[owner.GetShortUIName] chose forgiveness after a bereavement concerning [victim.GetShortUIName] and [culprit.GetShortUIName]."
 asp_vengeance_impossible_memory:0 "faced an unresolved bereavement after the culprit died"
 asp_vengeance_impossible_memory_desc:0 "I faced an unresolved bereavement after the culprit died concerning [victim.GetShortUIName] and [culprit.GetShortUIName]."
 asp_vengeance_impossible_memory_desc_second_perspective:0 "You faced an unresolved bereavement after the culprit died concerning [victim.GetShortUIName] and [culprit.GetShortUIName]."
 asp_vengeance_impossible_memory_desc_third_perspective:0 "[owner.GetShortUIName] faced an unresolved bereavement after the culprit died concerning [victim.GetShortUIName] and [culprit.GetShortUIName]."
 asp_vengeance_abandoned_memory:0 "released my pursuit after a bereavement"
 asp_vengeance_abandoned_memory_desc:0 "I released my pursuit after a bereavement concerning [victim.GetShortUIName] and [culprit.GetShortUIName]."
 asp_vengeance_abandoned_memory_desc_second_perspective:0 "You released your pursuit after a bereavement concerning [victim.GetShortUIName] and [culprit.GetShortUIName]."
 asp_vengeance_abandoned_memory_desc_third_perspective:0 "[owner.GetShortUIName] released a pursuit after a bereavement concerning [victim.GetShortUIName] and [culprit.GetShortUIName]."
 asp_vengeance_condition_personal:0 "Personal vengeance: I must be recorded as responsible for the culprit’s death. Closure removes 20 Stress; ordinary action consequences remain."
 asp_vengeance_condition_accountability:0 "Accountability: I must newly acquire the culprit’s custody. Closure grants 100 Prestige and removes 20 Stress; ordinary legal consequences remain."
 asp_vengeance_story_information_private:0 "Private ambition concerning [Story.MakeScope.Var('asp_vengeance_victim').Char.GetShortUIName] and [Story.MakeScope.Var('asp_target').Char.GetShortUIName].\n\n[SelectLocalization(ObjectsEqual(Story.MakeScope.Var('asp_interpretation').GetFlagName,'accountability'),'asp_vengeance_condition_accountability','asp_vengeance_condition_personal')]\n\nAge: [Story.MakeScope.ScriptValue('asp_story_age_days')|0] days. Reflection: [Story.MakeScope.ScriptValue('asp_time_until_review_days')|0] days remain. Private release is free after the original 8-year review age, even after retaining a reminder."
 asp_vengeance_story_information_declared:0 "Declared ambition concerning [Story.MakeScope.Var('asp_vengeance_victim').Char.GetShortUIName] and [Story.MakeScope.Var('asp_target').Char.GetShortUIName].\n\n[SelectLocalization(ObjectsEqual(Story.MakeScope.Var('asp_interpretation').GetFlagName,'accountability'),'asp_vengeance_condition_accountability','asp_vengeance_condition_personal')]\n\nAge: [Story.MakeScope.ScriptValue('asp_story_age_days')|0] days. Reflection: [Story.MakeScope.ScriptValue('asp_time_until_review_days')|0] days remain. Public deadline: [Story.MakeScope.ScriptValue('asp_time_until_pledge_days')|0] days remain. Expiry is first at the recorded deadline. Public success: +100 Prestige; withdrawal or expiry: -100 Prestige and base +15 Stress. Secret success withdraws the pledge."
