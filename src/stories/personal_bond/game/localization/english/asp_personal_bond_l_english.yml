l_english:
 asp_personal_bond_story:0 "A wish for closeness"
 asp_personal_bond_story_desc:0 "Someone I wish to draw closer to."
 asp_bond_story_information:0 "I wish to draw closer to [Story.MakeScope.Var('asp_target').Char.GetShortUIName].\n\n[Story.Custom('asp_bond_story_mode')]\nStatus: Private desire. No public pledge.\nAge: [Story.MakeScope.ScriptValue('asp_story_age_days')|0] days. Review: [Story.MakeScope.ScriptValue('asp_time_until_review_days')|0] days remaining. Release is free after the original 24-month review age. This desire grants no relationship or scheme access."
 asp_bond_origin_title:0 "A Wish for Closeness"
 asp_bond_origin_court_friendship:0 "[asp_bond_event_story.MakeScope.Var('asp_target').Char.GetShortUIName] is an acquaintance of my court, someone whose presence has found a place in my thoughts. I would like to know more than the face my duties bring before me.\n\nPerhaps there could be a friendship here, if I make time for it. I cannot know what will grow between us without trying."
 asp_bond_origin_relation_friendship:0 "There is already a personal connection between [asp_bond_event_story.MakeScope.Var('asp_target').Char.GetShortUIName] and me, but I find myself wanting something more from it: the ease of a friendship I could trust.\n\nI would like to draw closer. Whether that wish can become something we share, only time and care will tell."
 asp_bond_origin_court_romance:0 "[asp_bond_event_story.MakeScope.Var('asp_target').Char.GetShortUIName] is an acquaintance of my court, yet my thoughts have begun to wander beyond the business that places us together. I find myself wondering what closeness might feel like.\n\nA wish of my own is no promise of another's affection. Still, I would like to discover where it might lead."
 asp_bond_origin_relation_romance:0 "My connection with [asp_bond_event_story.MakeScope.Var('asp_target').Char.GetShortUIName] has begun to draw my thoughts toward a more intimate possibility. What would it mean to let this attraction guide me?\n\nI do not yet know what kind of closeness we might find. The thought alone is enough to make me wish to try."
 asp_bond_keep:0 "I will keep this desire."
 asp_bond_choose_friendship:0 "I would like a friend in them."
 asp_bond_choose_romance:0 "I want to follow this attraction."
 asp_bond_release:0 "Let this desire go."
 asp_bond_release_free:0 "Release this incompatible desire."
 asp_bond_friendship_condition:0 "Keep a private desire fulfilled by a new Friend or Best Friend relationship with this same person. On fulfillment: +50 Diplomacy lifestyle experience and base 10 Stress relief (Stress Loss modifiers apply). Pursue it through ordinary interactions; no relationship or scheme access is granted. First review: 24 months."
 asp_bond_romance_condition:0 "Keep a private desire fulfilled by a new Lover or Soulmate relationship with this same person. On fulfillment: base 10 Stress relief (Stress Loss modifiers apply), with no friendship experience. Ordinary attraction, pursuit eligibility and consequences apply. No relationship, scheme access or public pledge is granted. First review: 24 months."
 asp_bond_free_condition:0 "Current permanent romantic incompatibility permits release without added Stress or a fulfillment reward."
 asp_bond_terminal_title:0 "A Personal Bond"
 asp_bond_friendship_fulfilled:0 "[asp_bond_memory_target.GetShortUIName] and I are friends. What began as my own wish has become a bond between us, something I need no longer merely imagine.\n\nAmong the many demands upon me, I have found a person I can call a friend. That is worth remembering."
 asp_bond_romance_fulfilled:0 "There is an intimate bond now between [asp_bond_memory_target.GetShortUIName] and me. The closeness I once wondered about has become part of my life.\n\nWhatever else awaits us, this wish has led somewhere real. I can keep that knowledge close without making it the business of my realm."
 asp_bond_target_lost:0 "[asp_bond_memory_target.GetShortUIName] is dead. Whatever closeness I hoped to find can no longer grow between us.\n\nI am left with the thought of what might have been, and with a person who will never come to mean quite what I imagined."
 asp_bond_incompatible_closed:0 "The closeness I hoped for with [asp_bond_memory_target.GetShortUIName] no longer offers a future I can pursue. I have let the wish go.\n\nThere is little sense in feeding it with possibilities that have passed beyond us. My attention must find another home."
 asp_bond_released:0 "I have let my hope of closeness with [asp_bond_memory_target.GetShortUIName] grow quiet. Once it promised a future I wanted; now I am willing to leave that future unmade.\n\nI will remember the wish without letting it decide where my thoughts must go."
 asp_bond_reconsider_title:0 "Closeness Reconsidered"
 asp_bond_incompatible_desc:0 "The romantic future I imagined with [asp_bond_event_story.MakeScope.Var('asp_target').Char.GetShortUIName] no longer seems open to us. Yet a wish does not always fade as readily as the reasons for it.\n\nDo I hold to that hope, or allow it to grow quiet?"
 asp_bond_rival_desc:0 "[asp_bond_event_story.MakeScope.Var('asp_target').Char.GetShortUIName] has become my rival. It is a bitter change for someone toward whom I once wished to draw closer.\n\nHas that wish lost its meaning, or is there still something in it I am unwilling to surrender?"
 asp_bond_management_friendship:0 "I would like to call [asp_selected_story.MakeScope.Var('asp_target').Char.GetShortUIName] my friend. The thought still offers a warmth that the business of ruling seldom gives me.\n\nDo I want to make room for that friendship, or has the wish become something I carry out of habit?"
 asp_bond_management_romance:0 "My thoughts return to the closeness I hoped to find with [asp_selected_story.MakeScope.Var('asp_target').Char.GetShortUIName]. It is a private wish, and I alone must decide how much of my life to give it.\n\nDoes it still draw me onward?"
 asp_bond_friendship_memory:0 "A Wish Become Friendship"
 asp_bond_friendship_memory_desc:0 "[target.GetShortUIName] became the friend I had hoped to find."
 asp_bond_friendship_memory_second:0 "[target.GetShortUIName] became the friend you had hoped to find."
 asp_bond_friendship_memory_third:0 "[owner.GetShortUIName] found a hoped-for friendship with [target.GetShortUIName]."
 asp_bond_romance_memory:0 "A Private Hope Made Real"
 asp_bond_romance_memory_desc:0 "The intimate bond I hoped for with [target.GetShortUIName] became part of my life."
 asp_bond_romance_memory_second:0 "The intimate bond you hoped for with [target.GetShortUIName] became part of your life."
 asp_bond_romance_memory_third:0 "[owner.GetShortUIName] found a hoped-for closeness."
 asp_bond_loss_memory:0 "A Future Left Unmade"
 asp_bond_loss_memory_desc:0 "The closeness I imagined with [target.GetShortUIName] passed beyond my reach."
 asp_bond_loss_memory_second:0 "The closeness you imagined with [target.GetShortUIName] passed beyond your reach."
 asp_bond_loss_memory_third:0 "The closeness [owner.GetShortUIName] had imagined passed beyond reach."
 asp_bond_release_memory:0 "A Wish Grown Quiet"
 asp_bond_release_memory_desc:0 "I let my wish to draw closer to [target.GetShortUIName] grow quiet."
 asp_bond_release_memory_second:0 "You let your wish to draw closer to [target.GetShortUIName] grow quiet."
 asp_bond_release_memory_third:0 "[owner.GetShortUIName] let a wish for closeness grow quiet."
 asp_bond_release_cost:0 "Release before 24 months uses base [GetPlayer.MakeScope.ScriptValue('asp_desire_abandonment_stress')|0] Stress; your Stress Gain modifiers apply. From 24 months, release has no added Stress. No fulfillment reward. The effect preview shows the modified cost. "
 asp_bond_story_friendship:0 "Objective: form a new Friend or Best Friend relationship with this person. Fulfillment: base 10 Stress relief (Stress Loss modifiers apply), +50 Diplomacy experience."
 asp_bond_story_romance:0 "Objective: form a new Lover or Soulmate relationship with this person. Fulfillment: base 10 Stress relief (Stress Loss modifiers apply); no friendship experience."
 asp_bond_keep_flavor:0 "I give this wish a place in my life, and leave room for it to grow."
 asp_bond_friendship_flavor:0 "I turn my hopes toward a friendship with this person."
 asp_bond_romance_flavor:0 "I allow myself to hope for a more intimate bond with this person."
 asp_bond_release_flavor:0 "I let this wish grow quiet and turn my attention elsewhere."
 asp_bond_friendship_happened:0 "The friendship desire has been fulfilled and a memory recorded. Gained 50 Diplomacy lifestyle experience and applied fulfillment Stress relief (base 10; Stress Loss modifiers apply)."
 asp_bond_romance_happened:0 "The romantic desire has been fulfilled and a private memory recorded. Applied fulfillment Stress relief (base 10; Stress Loss modifiers apply), with no friendship experience or public pledge reward."
 asp_bond_loss_happened:0 "The desire has ended with a memory, without added Stress or a fulfillment reward."
 asp_bond_release_happened:0 "The desire has ended with a memory, without a fulfillment reward. The release cost shown when you chose this ending has been settled."
