l_english:
 asp_personal_bond_story:0 "A wish for closeness"
 asp_personal_bond_story_desc:0 "A private desire to deepen a particular personal connection."
 asp_bond_story_information:0 "Personal bond with [Story.MakeScope.Var('asp_target').Char.GetShortUIName]. Form a new friendship or romantic relationship according to this desire's interpretation. Age: [Story.MakeScope.ScriptValue('asp_story_age_days')|0] days; review in [Story.MakeScope.ScriptValue('asp_time_until_review_days')|0] days. Private desire."
 asp_bond_origin_title:0 "A Wish for Closeness"
 asp_bond_origin_court_friendship:0 "[asp_bond_event_story.MakeScope.Var('asp_target').Char.GetShortUIName] is a current acquaintance in my court or among its guests. I would like this connection to become a friendship.\n\nOnly a new Friend or Best Friend relationship satisfies this desire. Befriend is currently available through the game's ordinary rules; this desire grants no relationship or scheme access. Its first review is after 24 months."
 asp_bond_origin_relation_friendship:0 "[asp_bond_event_story.MakeScope.Var('asp_target').Char.GetShortUIName] is someone I know through an existing positive personal relationship. I would like this connection to become a friendship.\n\nOnly a new Friend or Best Friend relationship satisfies this desire. Befriend is currently available through the game's ordinary rules; this desire grants no relationship or scheme access. Its first review is after 24 months."
 asp_bond_origin_court_romance:0 "[asp_bond_event_story.MakeScope.Var('asp_target').Char.GetShortUIName] is a current acquaintance in my court or among its guests. I would like to explore romantic closeness.\n\nOnly a new Lover or Soulmate relationship satisfies this private desire. Seduce is currently available through the game's ordinary rules; attraction, eligibility and ordinary consequences still apply. Its first review is after 24 months."
 asp_bond_origin_relation_romance:0 "[asp_bond_event_story.MakeScope.Var('asp_target').Char.GetShortUIName] is someone I know through an existing positive personal relationship. I would like to explore romantic closeness.\n\nOnly a new Lover or Soulmate relationship satisfies this private desire. Seduce is currently available through the game's ordinary rules; attraction, eligibility and ordinary consequences still apply. Its first review is after 24 months."
 asp_bond_keep:0 "I will keep this desire."
 asp_bond_choose_friendship:0 "I seek friendship."
 asp_bond_choose_romance:0 "I seek romantic closeness."
 asp_bond_release:0 "Let this desire go."
 asp_bond_release_free:0 "Release this incompatible desire."
 asp_bond_friendship_condition:0 "Form a new Friend or Best Friend relationship with this same person. Gain 50 Diplomacy lifestyle experience and lose 10 Stress on fulfillment."
 asp_bond_romance_condition:0 "Form a new Lover or Soulmate relationship with this same person. Lose 10 Stress on fulfillment; no friendship experience or public pledge."
 asp_bond_free_condition:0 "Current permanent romantic incompatibility permits release without added Stress or a fulfillment reward."
 asp_bond_terminal_title:0 "A Personal Bond"
 asp_bond_friendship_fulfilled:0 "A new friendship has grown between [asp_bond_memory_target.GetShortUIName] and me. This desire is fulfilled, and I will remember the satisfaction it brought."
 asp_bond_romance_fulfilled:0 "[asp_bond_memory_target.GetShortUIName] and I have formed a new romantic bond. This private desire is fulfilled, and I will remember its satisfaction."
 asp_bond_target_lost:0 "With [asp_bond_memory_target.GetShortUINamePossessive] death, this hope of closeness has ended. I release the desire without added Stress or a fulfillment reward."
 asp_bond_incompatible_closed:0 "A permanent incompatibility has made this romantic hope unsuitable. I release the desire without added Stress or a fulfillment reward."
 asp_bond_released:0 "I have let go of my desire for closeness with [asp_bond_memory_target.GetShortUIName]. The person and the original circumstance remain part of my memory."
 asp_bond_reconsider_title:0 "Closeness Reconsidered"
 asp_bond_incompatible_desc:0 "The romantic eligibility of [asp_bond_event_story.MakeScope.Var('asp_target').Char.GetShortUIName] and me has changed. I may keep the same hope or release it without added Stress. Temporary scheme capacity and distance never require this closure."
 asp_bond_rival_desc:0 "[asp_bond_event_story.MakeScope.Var('asp_target').Char.GetShortUIName] has become my rival. I can retain this desire or let it go under the usual age-based release cost. No other person will replace this target."
 asp_bond_management_friendship:0 "I seek a new Friend or Best Friend relationship with [asp_selected_story.MakeScope.Var('asp_target').Char.GetShortUIName], a person connected through my court or an existing positive relationship at origin.\n\nPrivate desire. Age: [asp_selected_story.MakeScope.ScriptValue('asp_story_age_days')|0] days; next review in [asp_selected_story.MakeScope.ScriptValue('asp_time_until_review_days')|0] days. Fulfillment: −10 Stress and +50 Diplomacy lifestyle experience."
 asp_bond_management_romance:0 "I seek a new Lover or Soulmate relationship with [asp_selected_story.MakeScope.Var('asp_target').Char.GetShortUIName], a person connected through my court or an existing positive relationship at origin.\n\nPrivate desire. Age: [asp_selected_story.MakeScope.ScriptValue('asp_story_age_days')|0] days; next review in [asp_selected_story.MakeScope.ScriptValue('asp_time_until_review_days')|0] days. Fulfillment: −10 Stress. No public pledge is available."
 asp_bond_friendship_memory:0 "A fulfilled wish for friendship"
 asp_bond_friendship_memory_desc:0 "My wish to become friends with [target.GetShortUIName] was fulfilled."
 asp_bond_friendship_memory_second:0 "Your wish to become friends with [target.GetShortUIName] was fulfilled."
 asp_bond_friendship_memory_third:0 "[owner.GetShortUINamePossessive] wish to become friends with [target.GetShortUIName] was fulfilled."
 asp_bond_romance_memory:0 "A fulfilled private wish for romance"
 asp_bond_romance_memory_desc:0 "My private wish for romantic closeness with [target.GetShortUIName] was fulfilled."
 asp_bond_romance_memory_second:0 "Your private wish for romantic closeness with [target.GetShortUIName] was fulfilled."
 asp_bond_romance_memory_third:0 "[owner.GetShortUIName] fulfilled a private wish for closeness."
 asp_bond_loss_memory:0 "A hope for closeness ended"
 asp_bond_loss_memory_desc:0 "Circumstances ended my hope of closeness with [target.GetShortUIName]."
 asp_bond_loss_memory_second:0 "Circumstances ended your hope of closeness with [target.GetShortUIName]."
 asp_bond_loss_memory_third:0 "Circumstances ended [owner.GetShortUINamePossessive] hope of closeness."
 asp_bond_release_memory:0 "A wish for closeness released"
 asp_bond_release_memory_desc:0 "I released my wish for closeness with [target.GetShortUIName]."
 asp_bond_release_memory_second:0 "You released your wish for closeness with [target.GetShortUIName]."
 asp_bond_release_memory_third:0 "[owner.GetShortUIName] released a wish for closeness."
 asp_bond_release_cost:0 "Release before 24 months uses base [GetPlayer.MakeScope.ScriptValue('asp_desire_abandonment_stress')|0] Stress; your Stress Gain modifiers apply. From 24 months, release has no added Stress. No fulfillment reward. The effect preview shows the modified cost. "
