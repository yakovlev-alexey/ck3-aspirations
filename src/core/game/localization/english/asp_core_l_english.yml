 asp_declare:0 "Give my intention a public voice"
 asp_reconsider:0 "What do I truly want from this?"
 asp_withdraw:0 "I can no longer stand by my word."
 asp_public_release_cost:0 "Withdraw this commitment once: lose 100 Prestige and gain base 15 Stress, adjusted by your Stress Gain modifiers. Abandoning the aspiration at the same time adds no private release cost."
 asp_declare_rules:0 "Declare once, after 12 months, while the ambition is unfinished and before a qualifying milestone. Personal bonds cannot be declared."
 asp_declare_consequences:0 "Make a pledge before your court and realm for five years. Fulfillment before the deadline grants an additional 100 Prestige. Withdrawal or expiry costs 100 Prestige and base 15 Stress once; your Stress Gain modifiers apply. Expiry takes precedence at the exact deadline."
 asp_declare_title:0 "An intention made public"
 asp_declare_desc:0 "I have kept my purpose concerning [asp_selected_story.MakeScope.Var('asp_target').Char.GetShortUIName] to myself long enough. To speak before my court would give it a different weight: others would hear my intention and remember whether I stood by it.\n\n[SelectLocalization(ObjectsEqual(asp_selected_story.MakeScope.Var('asp_interpretation').GetFlagName,'accountability'),'asp_declare_accountability','asp_declare_personal')]"
 asp_declare_accountability:0 "I mean to bring the culprit into my custody and answer for what follows."
 asp_declare_personal:0 "I mean to bring the culprit's life to an end, and let my realm know whose will brought it about."
 asp_declare_confirm:0 "Let my court and realm hear my intention."
 asp_pledge_settlement_title:0 "My word before the realm"
 asp_pledge_fulfilled_desc:0 "I gave my word concerning [asp_pledge_event_target.GetShortUIName], and I have stood by it. My court need no longer wonder whether my resolve would outlast my words. The pursuit is over; what I make of its ending is mine to bear."
 asp_pledge_withdrawn_desc:0 "I once spoke before my court of my purpose concerning [asp_pledge_event_target.GetShortUIName]. I can no longer stand by that promise. Whatever my reasons, I must live with the distance between the words they heard and the course I took."
 asp_pledge_expired_desc:0 "The term I set for my pursuit concerning [asp_pledge_event_target.GetShortUIName] has passed. My word went further than my deeds. I may still care deeply about the matter, but I cannot pretend that I kept the promise I made."
 asp_pledge_excused_desc:0 "My pursuit concerning [asp_pledge_event_target.GetShortUIName] has been overtaken by events beyond my control. There is no longer a path by which I can keep the word I gave. I must leave that promise behind, along with the future I imagined for it."
 asp_review_choices_desc:0 "My thoughts turn again to [asp_selected_story.MakeScope.Var('asp_target').Char.GetShortUIName]. I remember why this mattered to me. Yet remembering a wish is not the same as still wanting it. What do I mean to do now?"
 asp_retain:0 "This still matters to me."
 asp_retain_tooltip:0 "Schedule reflection in 12 months for a Desire, or 3 years for an Ambition. Preserve the original cause and age; private release stays free after its original review age."
 asp_reinterpret_tooltip:0 "Preserve the original cause and age. A due reminder moves forward by the normal interval. No reward or new instance is created."
 asp_replace_title:0 "A place in my intentions"
 asp_replace_offer_desc:0 "[asp_replacement_cause_victim.GetShortUIName] is dead, and [asp_replacement_cause_killer.GetShortUIName] is responsible. The knowledge presses upon me even as other purposes demand my attention. I cannot give myself to every pursuit. Is there one I am willing to set aside for this loss?"
 asp_replace_desc:0 "My purpose concerning [asp_selected_story.MakeScope.Var('asp_target').Char.GetShortUIName] has held my attention, but the death of [asp_replacement_cause_victim.GetShortUIName] weighs upon me. If I turn toward [asp_replacement_cause_killer.GetShortUIName], I must leave an earlier intention behind."
 asp_replace_invalid_desc:0 "The moment has passed. What seemed a new path is no longer open to me; I will return to the purposes I already carry."
 asp_replace_confirm:0 "I will set this aside for what now matters more."
 asp_replace_cancel:0 "Leave my intentions as they are."
 asp_replace_1:0 "Consider replacing the ambition concerning [asp_replacement_1.MakeScope.Var('asp_target').Char.GetShortUIName]"
 asp_replace_2:0 "Consider replacing the ambition concerning [asp_replacement_2.MakeScope.Var('asp_target').Char.GetShortUIName]"
 asp_replace_3:0 "Consider replacing the ambition concerning [asp_replacement_3.MakeScope.Var('asp_target').Char.GetShortUIName]"
 asp_story_owned_by_you:0 "This aspiration belongs to you"
 asp_management_selected_declared_character_desc:0 "I spoke openly of my purpose concerning [asp_selected_story.MakeScope.Var('asp_target').Char.GetShortUIName]. My court heard me, and I know the weight of my own words. Does that promise still express my resolve?"
 asp_pledge_fulfilled_absent_desc:0 "The purpose I declared concerning [asp_pledge_event_target.GetShortUIName] reached its end while my attention lay elsewhere. I return to a matter already settled, and to the memory of the word I once gave."
 asp_recovery_pledge_fulfilled_absent_desc:0 "The recovery I promised for [asp_pledge_event_target.GetName] was completed while my attention lay elsewhere. I return to a changed county and a purpose that no longer waits upon me."
 asp_declare_vengeance_rules:0 "The culprit must be alive and outside your custody, with no completed qualifying milestone. For personal vengeance, death must be publicly attributable to you. Secret fulfillment grants private closure but withdraws the pledge at its stated cost. Declaration grants no lawful imprisonment reason or new action."
 asp_declare_recovery_rules:0 "You must personally hold the county, with Control below 80 and no qualifying completed construction. Fulfillment requires both Control at least 80 and completed supported construction begun after the ambition and funded by you. Existing, cancelled, foreign-funded or ownership-interrupted work cannot qualify."
 asp_pledge_reward_happened:0 "The public pledge has been fulfilled: gained 100 additional Prestige."
 asp_pledge_cost_happened:0 "The pledge has ended under the withdrawal or expiry policy: lost 100 Prestige and received the Stress cost based on 15 Stress, adjusted by your Stress Gain modifiers. Any remaining private aspiration may continue."
 asp_pledge_excused_happened:0 "The public pledge has ended without a reward or penalty."
 asp_pledge_absent_happened:0 "The pledge was fulfilled during your absence. No retrospective Prestige, Stress relief or other aspiration reward was granted."
 asp_abandon_flavor:0 "I turn my attention away from this pursuit, though I cannot erase what first drew me to it."
 asp_declare_flavor:0 "I prepare to speak of my purpose before my court."
 asp_declare_confirm_flavor:0 "I give my intention a voice before my court and realm, and stake my word upon it."
 asp_reconsider_flavor:0 "I consider what I want from this pursuit, and whether its meaning has changed."
 asp_withdraw_flavor:0 "I admit that I can no longer stand by the promise I made."
 asp_retain_flavor:0 "I hold to the purpose that first moved me, and give it more time."
 asp_replace_confirm_flavor:0 "I lay down an earlier pursuit and turn toward the matter now weighing upon me."
 asp_replace_consequences:0 "If the new circumstance and selected ambition remain eligible, end only this ambition at the shown release or pledge cost and begin the new ambition. No replacement reward is granted. Otherwise, nothing changes."
 asp_replace_offer_condition:0 "You already have three ambitions. Choose one to consider replacing, or retain them all. Its release or pledge cost is shown before confirmation. This incident will not offer another proposal."
