 asp_declare:0 "Declare intention"
 asp_reconsider:0 "Reconsider this aspiration"
 asp_withdraw:0 "Withdraw my public commitment"
 asp_public_release_cost:0 "Withdraw this commitment once: lose 100 Prestige and gain base 15 Stress, adjusted by your Stress Gain modifiers. Abandoning the aspiration at the same time adds no private release cost."
 asp_declare_rules:0 "The aspiration must be at least 12 months old, incomplete, with no irreversible qualifying milestone. The culprit must be alive and outside your custody. One declaration per aspiration."
 asp_declare_consequences:0 "Audience: your court and realm. Deadline: five years from declaration. Publicly attributable fulfillment grants an extra 100 Prestige. Expiry or withdrawal costs 100 Prestige and base 15 Stress once. Secret vengeance receives private closure but withdraws this unverifiable commitment at that same cost. At the recorded deadline, expiry is evaluated before completion."
 asp_declare_title:0 "An intention made public"
 asp_declare_desc:0 "Before my court and realm, I will commit to my pursuit concerning [asp_selected_story.MakeScope.Var('asp_target').Char.GetShortUIName].\n\n[SelectLocalization(ObjectsEqual(asp_selected_story.MakeScope.Var('asp_interpretation').GetFlagName,'accountability'),'asp_declare_accountability','asp_declare_personal')]\n\nI have five years from this declaration. Publicly attributable success grants 100 additional Prestige. Expiry or withdrawal loses 100 Prestige and adds base 15 Stress, adjusted by my Stress Gain modifiers. Secret vengeance grants private closure but incurs that withdrawal cost. Expiry takes precedence on the deadline itself."
 asp_declare_accountability:0 "I must acquire the culprit’s custody through an existing valid game action."
 asp_declare_personal:0 "I must be recorded as responsible for the culprit’s death, and the act must be publicly attributable."
 asp_declare_confirm:0 "Let my court and realm hear my intention."
 asp_pledge_settlement_title:0 "My word before the realm"
 asp_pledge_fulfilled_desc:0 "My pursuit concerning [asp_pledge_event_target.GetShortUIName] reached a publicly attributable conclusion before my deadline. The realm recognizes my kept word: 100 additional Prestige."
 asp_pledge_withdrawn_desc:0 "My public commitment concerning [asp_pledge_event_target.GetShortUIName] has been withdrawn. Secrecy may bring private closure, but cannot prove my word before the realm. I lose 100 Prestige and gain base 15 Stress, adjusted by my Stress Gain modifiers."
 asp_pledge_expired_desc:0 "The recorded deadline for my public commitment concerning [asp_pledge_event_target.GetShortUIName] has arrived. I lose 100 Prestige and gain base 15 Stress, adjusted by my Stress Gain modifiers, once. Any remaining private pursuit can continue; later success cannot reverse this settlement."
 asp_pledge_excused_desc:0 "My pursuit concerning [asp_pledge_event_target.GetShortUIName] became impossible through circumstances outside my responsibility. The public commitment ends without a reward or penalty."
 asp_review_choices_desc:0 "My aspiration concerning [asp_selected_story.MakeScope.Var('asp_target').Char.GetShortUIName] has its own cause and age. I may retain a due reminder, release it, or choose a supported interpretation. An active public commitment keeps its stated costs."
 asp_retain:0 "This still matters to me."
 asp_retain_tooltip:0 "Schedule reflection in 12 months for a Desire, or 3 years for an Ambition. Preserve the original cause and age; private release stays free after its original review age."
 asp_reinterpret_tooltip:0 "Preserve the original cause and age. A due reminder moves forward by the normal interval. No reward or new instance is created."
 asp_replace_title:0 "A place in my intentions"
 asp_replace_offer_desc:0 "The death of [asp_replacement_cause_victim.GetShortUIName], caused by [asp_replacement_cause_killer.GetShortUIName], demands reflection. I already hold three ambitions. I may choose one to replace, with its ordinary release or pledge cost shown before confirmation, or leave all three intact. This incident cannot offer another proposal."
 asp_replace_desc:0 "Replace my ambition concerning [asp_selected_story.MakeScope.Var('asp_target').Char.GetShortUIName] with this new pursuit concerning [asp_replacement_cause_killer.GetShortUIName]? The old ambition ends only if the new circumstance remains eligible. There is no replacement reward."
 asp_replace_invalid_desc:0 "The new circumstance or chosen ambition is no longer eligible. My existing intentions remain intact."
 asp_replace_confirm:0 "Release this ambition and make room for the new one."
 asp_replace_cancel:0 "Leave my intentions as they are."
 asp_replace_1:0 "Consider replacing the ambition concerning [asp_replacement_1.MakeScope.Var('asp_target').Char.GetShortUIName]"
 asp_replace_2:0 "Consider replacing the ambition concerning [asp_replacement_2.MakeScope.Var('asp_target').Char.GetShortUIName]"
 asp_replace_3:0 "Consider replacing the ambition concerning [asp_replacement_3.MakeScope.Var('asp_target').Char.GetShortUIName]"
 asp_story_owned_by_you:0 "This aspiration belongs to you"
 asp_management_selected_declared_character_desc:0 "My intention concerns [asp_selected_story.MakeScope.Var('asp_target').Char.GetShortUIName]. Declared aspiration.\n\nPublic deadline: [asp_selected_story.MakeScope.ScriptValue('asp_time_until_pledge_days')|0] days remain. Expiry takes precedence at the recorded deadline. I may continue pursuing it or withdraw the commitment at its stated cost."
 asp_pledge_fulfilled_absent_desc:0 "My commitment concerning [asp_pledge_event_target.GetShortUIName] was fulfilled while I was absent. I retain the memory of closure, but receive no retrospective Prestige or other aspiration reward."
 asp_recovery_pledge_fulfilled_absent_desc:0 "My commitment to restore [asp_pledge_event_target.GetName] was fulfilled while I was absent. I retain the memory of closure, but receive no retrospective Prestige or other aspiration reward."
