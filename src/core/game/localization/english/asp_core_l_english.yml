l_english:
 asp_review_aspirations_decision:0 "Review my aspirations"
 asp_review_aspirations_decision_desc:0 "The realm has no shortage of demands, but not all my wishes belong to the realm. Some have grown quiet; others still pull at me when my duties are done. I should give them a little thought, and decide what I still mean to pursue."
 asp_review_aspirations_decision_tooltip:0 "Take time to reflect on my intentions"
 asp_review_aspirations_decision_confirm:0 "Review my aspirations"
 asp_management_title:0 "My aspirations"
 asp_management_desc:0 "There are wishes I have carried through the press of daily affairs. Some still stir me; others I can scarcely remember choosing. Which one deserves my attention now?"
 asp_management_selected_title:0 "An intention of my own"
 asp_management_selected_character_desc:0 "Whenever I think of [asp_selected_story.MakeScope.Var('asp_target').Char.GetShortUIName], this purpose returns. I have given it a place in my life. Do I still mean to follow it, or have I carried it far enough?"
 asp_management_selected_county_desc:0 "My thoughts return to [asp_selected_story.MakeScope.Var('asp_target').Title.GetName] and the work I meant to do there. Other demands have not made that purpose disappear. I must decide how much of myself I can still give it."
 asp_management_closed_desc:0 "The matter that brought me here has passed. My attention is needed elsewhere."
 asp_abandon:0 "Let this intention go"
 asp_abandon_cost:0 "Base Stress cost: [asp_selected_story.MakeScope.ScriptValue('asp_abandonment_stress')|0]. Your Stress Gain modifiers affect the amount added. Release after the original review age adds no Stress, including after retaining a reminder."
 asp_back:0 "Back to my aspirations"
 asp_close:0 "Return to my affairs"
 asp_target_label:0 "Target"
 asp_core_review_title:0 "Time for reflection"
 asp_core_review_desc:0 "I have carried this purpose for a long time. Once, it seemed clear what I wanted; now I should consider whether the same wish still guides me. Holding fast and letting go both deserve thought."
 asp_core_review_return:0 "Consider this aspiration"
 asp_choice_1_ambition:0 "Ambition concerning [asp_choice_1.MakeScope.Var('asp_target').Char.GetShortUIName]"
 asp_choice_1_desire:0 "Desire concerning [asp_choice_1.MakeScope.Var('asp_target').Char.GetShortUIName]"
 asp_choice_1_county:0 "Ambition to recover [asp_choice_1.MakeScope.Var('asp_target').Title.GetName]"

